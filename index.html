<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class declass="game-container shadow-2xl border-4 border-slate-700 bg-black p-4 rounded-lg">
        <div class="info text-white mb-4 text-center">
            <h1>TETRIS</h1>
            <p class="score-text">Score: <span id="score">0</span></p>
        </div>
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="controls">
            <p>⬅️ ← | → ➡️</p>
            <p>⬆️ Rotate | ⬇️ Down</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
